name: Update YouTube catalog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test catalog updater
        run: node --test scripts/update-youtube-catalog.test.mjs

      - name: Fetch the latest channel uploads
        run: node scripts/update-youtube-catalog.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Publish catalog changes
        run: |
          if git diff --quiet -- music-data.js; then
            echo "The YouTube catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-data.js
          git commit -m "Update YouTube video catalog"
          git push
