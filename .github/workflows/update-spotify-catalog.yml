name: Update Spotify catalog

on:
  schedule:
    - cron: "22 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Spotify updater
        run: node --test scripts/update-spotify-catalog.test.mjs

      - name: Fetch the latest artist catalog
        run: node scripts/update-spotify-catalog.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ARTIST_ID: ${{ vars.SPOTIFY_ARTIST_ID || '7pxIYxdkx2675ZGKSAPBAy' }}

      - name: Publish catalog changes
        run: |
          if git diff --quiet -- spotify-data.js; then
            echo "The Spotify catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spotify-data.js
          git commit -m "Update Spotify catalog"
          git push
